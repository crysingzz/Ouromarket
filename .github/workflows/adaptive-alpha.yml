name: Adaptive Alpha
on:
  pull_request:
    paths: ['adaptive-alpha/**', '.github/workflows/adaptive-alpha.yml']
  push:
    paths: ['adaptive-alpha/**', '.github/workflows/adaptive-alpha.yml']
permissions:
  contents: read
jobs:
  laboratory:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adaptive-alpha
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.15'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run pyrefly check
      - run: uv run mypy src
      - run: make test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-alpha-coverage
          path: |
            adaptive-alpha/.state/coverage.xml
            adaptive-alpha/.state/coverage-html/
          include-hidden-files: true
      - run: make spec
      - run: uv run pip-audit --skip-editable
      - run: make up
      - run: uv run python scripts/smoke.py
      - run: docker compose exec -T worker python - --offline-literature < scripts/mock_autonomous.py
      - if: always()
        run: docker compose down
