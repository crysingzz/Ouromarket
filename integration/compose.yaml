name: ouromarket-engineering
services:
  gateway:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    entrypoint: [nginx, -g, "daemon off;"]
    user: "101:101"
    ports: ["127.0.0.1:8765:8765"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.25
    restart: unless-stopped
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    networks: [ingress, engineering]
    depends_on:
      ouroboros: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8765/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
  ouroboros:
    build:
      context: ..
      dockerfile: integration/Dockerfile
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1536m
    cpus: 1.0
    restart: unless-stopped
    tmpfs: ["/tmp:size=64m,mode=1777"]
    volumes: [runtime-state:/state, strategy-workspaces:/workspaces]
    secrets: [ouroboros_token]
    networks: [engineering]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8765/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
networks:
  ingress: {}
  engineering: {internal: true}
volumes:
  runtime-state: {}
  strategy-workspaces: {}
secrets:
  ouroboros_token: {file: .secrets/ouroboros_token}
