# Merge after adaptive-alpha/compose.yaml. Relative paths resolve against that base.
services:
  worker:
    environment:
      ALPHA_OUROBOROS_URL: http://ouroboros:8765
      ALPHA_OUROBOROS_WORKSPACE: /workspaces
      ALPHA_OUROBOROS_PROVISION_WORKSPACES: "true"
    secrets: [ouroboros_token]
    networks: [engineering]
networks:
  engineering:
    external: true
    name: ouromarket-engineering_engineering
secrets:
  ouroboros_token:
    file: ${ALPHA_ENGINEERING_TOKEN_FILE:-../integration/.secrets/ouroboros_token}
